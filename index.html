<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Syam's social profile and links">
    <meta name="theme-color" content="#080808">
    <title>Syam — Links</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="stylesheet" href="./css/buttons.css">
    <link rel="stylesheet" href="./css/desktop.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <div id="desktop-background"></div>
    <main class="profile-page">
        <section class="profile-card">
            <div id="profile-background" class="profile-background"></div>
            <div class="profile-overlay"></div>
            <div class="profile-content">
                <img id="profile-image" class="profile-image" src="" alt="Kesav profile picture">
                <h1 id="profile-name"></h1>
                <p id="profile-username"></p>
                <p id="profile-bio"></p>
                <div id="social-links" class="social-links"></div>
            </div>
        </section>
    </main>
    <script src="./js/config.js"></script>
    <script src="./js/backgrounds.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
